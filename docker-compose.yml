version: '3.8'

services:
  # Flask API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: smart-grocery-api
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///app.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-me}
    volumes:
      - ./api/app.db:/app/app.db
      - ./api/migrations:/app/migrations
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smart-grocery-network

  # React Frontend (built and served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-grocery-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:5000
    networks:
      - smart-grocery-network

  # Nginx reverse proxy (optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: smart-grocery-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - smart-grocery-network

networks:
  smart-grocery-network:
    driver: bridge

volumes:
  smart-grocery-db:
    driver: local