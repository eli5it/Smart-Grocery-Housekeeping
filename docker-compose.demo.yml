version: '3.8'

services:
  # Unified application (Frontend + Backend served by Flask) - DEMO VERSION
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-grocery-app
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///app.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-me}
    volumes:
      - app_data:/app/api/data
    ports:
      - "8080:5000"  # External port 8080 maps to internal port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Simple startup command - just run migrations and start the app
    command: >
      sh -c "
      cd /app/api &&
      export FLASK_APP=run.py &&
      echo '=== Database Migration Setup ===' &&
      flask db upgrade &&
      echo '=== Starting Application ===' &&
      exec gunicorn --bind 0.0.0.0:5000 --timeout 120 --workers 1 run:app
      "

volumes:
  app_data:
    driver: local
