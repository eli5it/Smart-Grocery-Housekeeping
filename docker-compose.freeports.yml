version: '3.8'

# Free ports deployment - uses high port numbers to avoid conflicts
services:
  api:
    build:
      context: ./api
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///app.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-test-secret-key-change-in-production}
    volumes:
      - api_data:/app/data
    ports:
      - "8001:5000"  # Use port 8001 for API (high port, unlikely to conflict)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.bypass
    ports:
      - "8080:80"  # Use port 8080 for frontend
    restart: unless-stopped
    depends_on:
      - api

volumes:
  api_data:
