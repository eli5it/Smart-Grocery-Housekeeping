version: '3.8'

services:
  # Unified application (Frontend + Backend served by Flask)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-grocery-app
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///app.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-me}
    volumes:
      - app_data:/app/api/data
      - ./api/app.db:/app/api/app.db
    ports:
      - "5000:5000"  # Single port for both frontend and backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smart-grocery-network

networks:
  smart-grocery-network:
    driver: bridge

volumes:
  app_data:
    driver: local
